<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitTrackr — Sign Up</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--primary:#7c3aed;--accent:#f59e0b;--text:#f1f5f9;--muted:#94a3b8}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif;background:#060612;overflow:hidden;position:relative}
    .bg{position:fixed;inset:0;z-index:0}
    .orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.35;animation:drift 12s ease-in-out infinite}
    .orb-1{width:600px;height:600px;background:radial-gradient(#3b82f6,transparent 70%);top:-150px;right:-150px;animation-delay:0s}
    .orb-2{width:500px;height:500px;background:radial-gradient(#7c3aed,transparent 70%);bottom:-100px;left:-100px;animation-delay:-4s}
    .orb-3{width:400px;height:400px;background:radial-gradient(#f59e0b,transparent 70%);top:40%;left:35%;animation-delay:-8s}
    @keyframes drift{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,-30px) scale(1.05)}66%{transform:translate(-30px,40px) scale(.95)}}
    .grid-overlay{position:fixed;inset:0;background-image:linear-gradient(rgba(59,130,246,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(59,130,246,.03) 1px,transparent 1px);background-size:60px 60px;z-index:0}
    .particles{position:fixed;inset:0;z-index:0;overflow:hidden}
    .particle{position:absolute;border-radius:50%;animation:float-up linear infinite}
    @keyframes float-up{0%{transform:translateY(100vh) scale(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-100px) scale(1);opacity:0}}
    .auth-wrap{position:relative;z-index:10;width:100%;max-width:440px;padding:20px;animation:card-in .7s cubic-bezier(.34,1.3,.64,1) both}
    @keyframes card-in{from{opacity:0;transform:translateY(40px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
    .glass-card{background:rgba(255,255,255,.04);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.1);border-radius:28px;padding:44px 40px;box-shadow:0 32px 80px rgba(0,0,0,.6),0 0 0 1px rgba(59,130,246,.12),inset 0 1px 0 rgba(255,255,255,.1);position:relative;overflow:hidden}
    .glass-card::before{content:'';position:absolute;top:0;left:10%;right:10%;height:1px;background:linear-gradient(90deg,transparent,rgba(59,130,246,.8),rgba(245,158,11,.5),transparent)}
    .logo-wrap{text-align:center;margin-bottom:8px}
    .logo-icon{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);display:inline-flex;align-items:center;justify-content:center;font-size:1.8rem;margin-bottom:16px;box-shadow:0 8px 32px rgba(59,130,246,.5);animation:logo-pulse 3s ease-in-out infinite}
    @keyframes logo-pulse{0%,100%{box-shadow:0 8px 32px rgba(59,130,246,.5)}50%{box-shadow:0 8px 48px rgba(59,130,246,.8),0 0 0 8px rgba(59,130,246,.1)}}
    .logo-text{font-family:'Bebas Neue',sans-serif;font-size:2.2rem;letter-spacing:4px;color:#f1f5f9;line-height:1}
    .logo-text span{color:#f59e0b}
    .tagline{color:rgba(148,163,184,.8);font-size:.85rem;margin-top:6px;letter-spacing:.5px}
    .auth-heading{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:3px;color:#f1f5f9;margin:28px 0 20px;display:flex;align-items:center;gap:12px}
    .auth-heading::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(59,130,246,.4),transparent)}
    .alert{border-radius:10px;padding:10px 14px;font-size:.85rem;font-weight:500;margin-bottom:16px;display:none;animation:fadeIn .25s ease}
    .alert.show{display:block}
    .alert-error{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#fca5a5}
    .alert-success{background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.3);color:#93c5fd}
    @keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
    .input-group{position:relative;margin-bottom:14px}
    .input-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:1rem;opacity:.45;pointer-events:none;transition:opacity .2s}
    .glass-input{width:100%;padding:14px 16px 14px 44px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;color:#f1f5f9;font-family:'DM Sans',sans-serif;font-size:.95rem;outline:none;transition:border-color .2s,background .2s,box-shadow .2s}
    .glass-input::placeholder{color:rgba(148,163,184,.5)}
    .glass-input:focus{border-color:rgba(59,130,246,.6);background:rgba(59,130,246,.07);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
    .pw-toggle{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(148,163,184,.5);cursor:pointer;font-size:1rem;padding:4px;transition:color .2s}
    .pw-toggle:hover{color:#f1f5f9}
    .pw-strength{height:4px;border-radius:4px;margin-top:6px;background:rgba(255,255,255,.06);overflow:hidden}
    .pw-fill{height:100%;border-radius:4px;transition:width .3s,background .3s;width:0%}
    .pw-hint{font-size:.72rem;color:rgba(148,163,184,.5);margin-top:4px;margin-bottom:2px}
    .btn-submit{width:100%;padding:15px;margin-top:8px;background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.4);border-radius:12px;color:#93c5fd;font-family:'DM Sans',sans-serif;font-size:1rem;font-weight:700;letter-spacing:.5px;cursor:pointer;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s,background .2s,border-color .2s;box-shadow:0 4px 20px rgba(59,130,246,.15)}
    .btn-submit:hover{transform:translateY(-2px);background:rgba(59,130,246,.25);border-color:rgba(59,130,246,.7);box-shadow:0 8px 28px rgba(59,130,246,.3);color:#fff}
    .btn-submit:active{transform:translateY(0)}
    .btn-submit:disabled{opacity:.6;cursor:not-allowed;transform:none}
    .btn-submit::after{content:'';position:absolute;top:0;left:-100%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent);transform:skewX(-20deg);transition:left .5s}
    .btn-submit:hover::after{left:150%}
    .auth-link{text-align:center;margin-top:22px;color:rgba(148,163,184,.6);font-size:.88rem}
    .auth-link a{color:#a78bfa;text-decoration:none;font-weight:600;transition:color .2s}
    .auth-link a:hover{color:#f59e0b}
  </style>
</head>
<body>
<div class="bg"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>
<div class="grid-overlay"></div>
<div class="particles" id="particles"></div>

<div class="auth-wrap">
  <div class="glass-card">
    <div class="logo-wrap">
      <div class="logo-icon">🏋️</div>
      <div class="logo-text">FIT<span>TRACKR</span></div>
      <p class="tagline">Start your fitness journey today</p>
    </div>

    <div class="auth-heading">CREATE ACCOUNT</div>
    <div id="alertBox" class="alert"></div>

    <form id="signupForm" novalidate>
      <div class="input-group">
        <span class="input-icon">👤</span>
        <input type="text" id="signupName" class="glass-input" placeholder="Full Name" required autocomplete="name">
      </div>
      <div class="input-group">
        <span class="input-icon">✉️</span>
        <input type="email" id="signupEmail" class="glass-input" placeholder="Email Address" required autocomplete="email">
      </div>
      <div class="input-group">
        <span class="input-icon">🔒</span>
        <input type="password" id="signupPassword" class="glass-input" placeholder="Password (min 6 characters)" required autocomplete="new-password">
        <button type="button" class="pw-toggle" id="pwToggle">👁️</button>
      </div>
      <div class="pw-strength"><div class="pw-fill" id="pwFill"></div></div>
      <p class="pw-hint" id="pwHint">Enter a password</p>

      <button type="submit" class="btn-submit" id="signupBtn">
        <span id="btnText">Create My Account →</span>
      </button>
    </form>

    <p class="auth-link">Already have an account? <a href="index.html">← Sign in</a></p>
  </div>
</div>

<script>
  // Particles
  const pc = document.getElementById("particles");
  for(let i=0;i<18;i++){
    const p=document.createElement("div");
    p.className="particle";
    p.style.cssText=`left:${Math.random()*100}%;width:${Math.random()*3+1}px;height:${Math.random()*3+1}px;animation-duration:${Math.random()*12+8}s;animation-delay:${Math.random()*10}s;background:${['rgba(124,58,237,.6)','rgba(59,130,246,.5)','rgba(245,158,11,.4)'][Math.floor(Math.random()*3)]};`;
    pc.appendChild(p);
  }

  // Password toggle
  document.getElementById("pwToggle").addEventListener("click", function() {
    const pw = document.getElementById("signupPassword");
    if(pw.type==="password"){pw.type="text";this.textContent="🙈";}
    else{pw.type="password";this.textContent="👁️";}
  });

  // Password strength meter
  document.getElementById("signupPassword").addEventListener("input", function() {
    const val=this.value, fill=document.getElementById("pwFill"), hint=document.getElementById("pwHint");
    if(!val){fill.style.width="0%";hint.textContent="Enter a password";hint.style.color="";return;}
    let s=0;
    if(val.length>=6)s++; if(val.length>=10)s++; if(/[A-Z]/.test(val))s++;
    if(/[0-9]/.test(val))s++; if(/[^A-Za-z0-9]/.test(val))s++;
    const lv=[
      {w:"20%",bg:"#ef4444",t:"Too short"},
      {w:"40%",bg:"#f59e0b",t:"Weak"},
      {w:"60%",bg:"#f59e0b",t:"Fair"},
      {w:"80%",bg:"#3b82f6",t:"Good"},
      {w:"90%",bg:"#3b82f6",t:"Strong"},
      {w:"100%",bg:"#3b82f6",t:"Very strong ✓"}
    ][Math.min(s,5)];
    fill.style.width=lv.w; fill.style.background=lv.bg;
    hint.textContent=lv.t; hint.style.color=lv.bg;
  });

  const alertBox=document.getElementById("alertBox"), btnText=document.getElementById("btnText");
  function showAlert(msg,type="error"){alertBox.textContent=msg;alertBox.className=`alert alert-${type} show`;}
  function validateEmail(e){return/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);}

  document.getElementById("signupForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    const name=document.getElementById("signupName").value.trim();
    const email=document.getElementById("signupEmail").value.trim();
    const password=document.getElementById("signupPassword").value;
    if(!name||!email||!password) return showAlert("All fields are required.");
    if(!validateEmail(email)) return showAlert("Please enter a valid email address.");
    if(password.length<6) return showAlert("Password must be at least 6 characters.");
    btnText.textContent="Creating your account…";
    document.getElementById("signupBtn").disabled=true;
    try {
      const res=await fetch("http://localhost:3000/signup",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,email,password})});
      const data=await res.json();
      if(res.ok&&data.message==="Signup successful!"){
        localStorage.setItem("isLoggedIn","true");
        localStorage.setItem("username",data.name);
        showAlert("Account created! Redirecting…","success");
        setTimeout(()=>window.location.href="dashboard.html",1000);
      } else {
        showAlert(data.message||"Signup failed. Please try again.");
        btnText.textContent="Create My Account →";
        document.getElementById("signupBtn").disabled=false;
      }
    } catch {
      showAlert("Network error. Is the server running?");
      btnText.textContent="Create My Account →";
      document.getElementById("signupBtn").disabled=false;
    }
  });
</script>
</body>
</html>
